<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playback Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <h2>Playback Search</h2>

    <!-- Study Mode Panel -->
    <div id="study-panel">
        <h3>User Study Mode</h3>
        <div class="form-row">
            <label>Participant:</label>
            <input type="text" id="study-participant" placeholder="e.g., P01">
        </div>
        <div class="form-row">
            <label>Feature:</label>
            <select id="study-feature">
                <option value="">-- Select Feature --</option>
            </select>
        </div>
        <div class="form-row">
            <label>Audio:</label>
            <select id="study-audio">
                <option value="">-- Select Audio --</option>
            </select>
        </div>
        <button id="btn-start-study">Start Study</button>
        <button id="btn-stop-study">Stop Study</button>
    </div>

    <!-- Interruption Overlay -->
    <div id="interruption-overlay">
        <div id="interruption-content">
            <div class="task-label">Task <span id="task-number">1</span> / <span id="task-total">7</span></div>
            <div class="instruction">Find this word:</div>
            <div class="target-word" id="target-word-display">TARGET</div>
            <div class="instruction">Press SPACEBAR when you find it</div>
            <div class="timer"><span id="task-timer">90</span>s</div>
        </div>
    </div>

    <!-- Feedback Overlay -->
    <div id="feedback-overlay">
        <div id="feedback-content">Good!</div>
    </div>

    <!-- Prep Overlay -->
    <div id="prep-overlay">
        <div id="prep-content">
            <div class="prep-label">Get Ready</div>
            <div class="prep-count" id="prep-count-display">3</div>
            <div class="prep-instruction">Playback resumes soon</div>
        </div>
    </div>

    <div class="section audio-blocker-wrap">
        <audio id="audio-player" controls></audio>
        <div class="audio-blocker" aria-hidden="true"></div>
    </div>

    <div id="transcript" style="display:none;"></div>

    <div id="instructions">
        <b>← Left Arrow:</b> Backward / <b>→ Right Arrow:</b> Forward<br>
    </div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
